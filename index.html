<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRIEF-A</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1f2937; --muted:#6b7280; --accent:#2563eb; --line:#e5e7eb; --err:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",Tahoma,sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  h1 { font-size:1.35rem; margin:8px 0 2px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
  .langs { display:flex; gap:8px; margin:8px 0 14px; }
  .langs button { flex:1; padding:10px; border:1px solid #cbd5e1; background:#fff; border-radius:10px; font-size:1rem; cursor:pointer; color:var(--ink); }
  .langs button.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:1.05rem; margin:0 0 8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .grid{grid-template-columns:1fr;} }
  .f label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  input[type=text], input[type=date], input[type=number], select {
    width:100%; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:1rem; background:#fff; color:var(--ink); }
  .legend { font-size:.92rem; margin:0; }
  .item { padding:12px 6px; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item.missing { background:#fef2f2; border-radius:8px; }
  .q { font-size:.97rem; margin-bottom:8px; }
  .q .n { color:var(--muted); margin-inline-end:6px; font-size:.85rem; }
  .opts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .opts input { position:absolute; opacity:0; pointer-events:none; }
  .opts label { display:flex; align-items:center; justify-content:center; min-height:42px; padding:6px;
    border:1px solid #cbd5e1; border-radius:10px; font-size:.92rem; cursor:pointer; user-select:none; background:#fff; text-align:center; }
  .opts input:checked + label { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  .opts input:focus-visible + label { outline:2px solid var(--accent); outline-offset:2px; }
  .progress { position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5; font-size:.85rem; color:var(--muted); }
  .bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:4px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  button { font-family:inherit; }
  .actions button { font-size:1rem; padding:12px 18px; border-radius:10px; border:0; cursor:pointer; }
  .primary { background:var(--accent); color:#fff; font-weight:600; }
  .secondary { background:#e5e7eb; color:var(--ink); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; }
  #msg { margin-top:12px; font-size:.9rem; }
  #msg.err { color:var(--err); }
  .note { font-size:.78rem; color:var(--muted); margin-top:20px; }
</style>
</head>
<body>
<main>
  <h1>BRIEF-A</h1>
  <div class="sub" id="subtitle"></div>

  <div class="langs" id="langs">
    <button type="button" data-l="fr">Français</button>
    <button type="button" data-l="en">English</button>
    <button type="button" data-l="ar">العربية</button>
  </div>

  <div class="card">
    <h2 id="t_instr"></h2>
    <p class="legend" id="instr"></p>
  </div>

  <form id="f" novalidate>
    <div class="card">
      <h2 id="t_info"></h2>
      <div class="grid">
        <div class="f"><label for="nom" id="l_nom"></label><input type="text" id="nom"></div>
        <div class="f"><label for="date" id="l_date"></label><input type="date" id="date"></div>
        <div class="f"><label for="sexe" id="l_sexe"></label><select id="sexe"></select></div>
        <div class="f"><label for="age" id="l_age"></label><input type="number" id="age" min="0" max="120"></div>
        <div class="f"><label for="naiss" id="l_naiss"></label><input type="date" id="naiss"></div>
        <div class="f"><label for="scol" id="l_scol"></label><select id="scol"></select></div>
        <div class="f"><label for="annees" id="l_annees"></label><input type="number" id="annees" min="0" max="40"></div>
      </div>
    </div>

    <div class="progress"><span id="pc"></span><div class="bar"><div id="pb"></div></div></div>

    <div class="card">
      <h2 id="t_q"></h2>
      <div id="items"></div>
    </div>

    <div class="card actions">
      <button type="button" class="primary" id="send"></button>
      <button type="button" class="secondary" id="dl"></button>
    </div>
    <div id="msg"></div>
  </form>

  <p class="note" id="copy"></p>
</main>

"يقول الناس إنني لا أفكر قبل أن أتصرف",
"أجد صعوبة في العثور على الأشياء في غرفتي أو خزانتي أو مكتبي",
"أجد صعوبة في تنظيم الأنشطة",
"بعد حدوث مشكلة، أجد صعوبة في تجاوزها بسهولة",
"أجد صعوبة في القيام بأكثر من شيء واحد في الوقت نفسه",
"يتغيّر مزاجي باستمرار",
"لا أفكر في العواقب قبل أن أتصرف",
"أجد صعوبة في تنظيم العمل",
"أغضب بسرعة أو بسهولة لأتفه الأسباب",
"أنا مندفع",
"لا أعيد ما أستخدمه إلى مكانه",
"أواجه مشكلات في إكمال عملي"
]
};

// Les réponses sont stockées sous forme de code (0,1,2) et envoyées en français
const FR_OPTS = ["Jamais","Parfois","Souvent"];
const $ = id => document.getElementById(id);
let lang = "fr";

function setSelect(id, list, keepIdx) {
  const s = $(id), idx = keepIdx ? s.selectedIndex : 0;
  s.innerHTML = `<option value="">${UI[lang].choose}</option>` + list.map((t,i)=>`<option value="${i}">${t}</option>`).join("");
  s.selectedIndex = idx > 0 ? idx : 0;
}

function renderItems() {
  const saved = {};
  document.querySelectorAll("#items input:checked").forEach(r => saved[r.name] = r.value);
  const u = UI[lang];
  $("items").innerHTML = ITEMS[lang].map((t, i) => {
    const n = i + 1;
    return `<div class="item" id="row${n}"><div class="q"><span class="n">${n}.</span>${t}</div><div class="opts">` +
      u.opts.map((o, v) => `<input type="radio" name="q${n}" id="q${n}_${v}" value="${v}"${saved["q"+n]==v?" checked":""}><label for="q${n}_${v}">${o}</label>`).join("") +
      `</div></div>`;
  }).join("");
  updateProgress();
}

function applyLang(l) {
  lang = l;
  const u = UI[l];
  document.documentElement.lang = l;
  document.documentElement.dir = u.dir;
  document.querySelectorAll("#langs button").forEach(b => b.classList.toggle("on", b.dataset.l === l));
  $("subtitle").textContent = u.sub;
  ["t_instr","t_info","t_q","instr","copy"].forEach(k => $(k).textContent = u[k === "copy" ? "copy" : k]);
  ["nom","date","sexe","age","naiss","scol","annees"].forEach(k => $("l_"+k).textContent = u[k]);
  setSelect("sexe", u.sexes, true);
  setSelect("scol", u.scols, true);
  $("send").textContent = u.send;
  $("dl").textContent = u.dl;
  $("msg").textContent = "";
  renderItems();
}

function answered() { return ITEMS.fr.filter((_, i) => document.querySelector(`input[name=q${i+1}]:checked`)).length; }
function updateProgress() {
  const a = answered();
  $("pc").textContent = a + " / 75 " + UI[lang].prog;
  $("pb").style.width = (a / 75 * 100) + "%";
}

document.addEventListener("change", e => {
  if (e.target.type === "radio") e.target.closest(".item").classList.remove("missing");
  updateProgress();
});
$("langs").addEventListener("click", e => { if (e.target.dataset.l) applyLang(e.target.dataset.l); });

function msg(t, err) { const m = $("msg"); m.textContent = t; m.className = err ? "err" : ""; }

function validate() {
  for (const id of ["nom","date","sexe","age","naiss","scol","annees"]) {
    if (!$(id).value.trim()) { $(id).focus(); msg(UI[lang].errInfo, true); return false; }
  }
  let first = null;
  ITEMS.fr.forEach((_, i) => {
    const n = i + 1, ok = document.querySelector(`input[name=q${n}]:checked`);
    $("row" + n).classList.toggle("missing", !ok);
    if (!ok && !first) first = $("row" + n);
  });
  if (first) { first.scrollIntoView({behavior:"smooth", block:"center"}); msg(UI[lang].errItems, true); return false; }
  return true;
}

// Le contenu de l'e-mail est toujours en français (pour le destinataire), quelle que soit la langue de remplissage
function buildText() {
  const F = UI.fr, L = [];
  L.push("BRIEF-A - Formulaire d'auto-évaluation");
  L.push("Langue de remplissage: " + {fr:"Français",en:"English",ar:"العربية"}[lang]);
  L.push("Nom: " + $("nom").value);
  L.push("Date du jour: " + $("date").value);
  L.push("Sexe: " + F.sexes[$("sexe").value]);
  L.push("Âge: " + $("age").value);
  L.push("Date de naissance: " + $("naiss").value);
  L.push("Scolarité: " + F.scols[$("scol").value] + " (" + $("annees").value + " ans)");
  L.push("");
  L.push("Réponses (dernier mois):");
  ITEMS.fr.forEach((_, i) => {
    const v = document.querySelector(`input[name=q${i+1}]:checked`).value;
    L.push((i+1) + ". " + FR_OPTS[v]);
  });
  return L.join("\n");
}

$("send").onclick = () => {
  if (!validate()) return;
  const text = buildText();
  const url = "mailto:" + DESTINATAIRE + "?subject=" + encodeURIComponent(SUJET + " - " + $("nom").value) + "&body=" + encodeURIComponent(text);
  msg(UI[lang].okMail);
  window.location.href = url;
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(()=>{});
};

$("dl").onclick = () => {
  if (!validate()) return;
  const blob = new Blob([buildText()], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "BRIEF-A_" + $("nom").value.replace(/\s+/g,"_") + ".txt";
  a.click();
  msg(UI[lang].okDl);
};

$("date").valueAsDate = new Date();
applyLang("fr");
</script>
